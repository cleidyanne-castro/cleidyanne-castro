<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B1B"/>
      <stop offset="0.52" stop-color="#0A2D2B"/>
      <stop offset="1" stop-color="#0F3E3B"/>
    </linearGradient>

    <linearGradient id="line" x1="100" y1="130" x2="1100" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" stroke="#5EEAD4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="26" fill="url(#grid)"/>

  <!-- animated tech flow -->
  <g opacity="0.75">
    <path d="M80 185 C210 80, 310 220, 430 122 C540 30, 650 200, 770 105 C870 28, 990 160, 1120 72"
          stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <animate attributeName="stroke-dasharray" values="0 1400;140 1260;0 1400" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-420;-840" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- moving data points -->
  <g fill="#5EEAD4" filter="url(#glow)">
    <circle r="5">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M80 185 C210 80, 310 220, 430 122 C540 30, 650 200, 770 105 C870 28, 990 160, 1120 72"/>
    </circle>
    <circle r="3.5" opacity="0.85">
      <animateMotion dur="8s" begin="-2.6s" repeatCount="indefinite"
        path="M80 185 C210 80, 310 220, 430 122 C540 30, 650 200, 770 105 C870 28, 990 160, 1120 72"/>
    </circle>
    <circle r="3" opacity="0.65">
      <animateMotion dur="8s" begin="-5.2s" repeatCount="indefinite"
        path="M80 185 C210 80, 310 220, 430 122 C540 30, 650 200, 770 105 C870 28, 990 160, 1120 72"/>
    </circle>
  </g>

  <!-- accent particles -->
  <g fill="#99F6E4">
    <circle cx="185" cy="96" r="2.5">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="356" cy="188" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="621" cy="69" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="882" cy="166" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1044" cy="101" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- main name -->
  <text x="600" y="92" text-anchor="middle"
        fill="#ECFEFF"
        font-family="Inter, Arial, sans-serif"
        font-size="36"
        font-weight="700"
        letter-spacing="1">
    Cleidyanne Castro
  </text>

  <!-- professional subtitle -->
  <text x="600" y="124" text-anchor="middle"
        fill="#99F6E4"
        font-family="Inter, Arial, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="2">
    DATA ENGINEERING • AI ENGINEERING • BUSINESS & CUSTOMER EXPERIENCE
  </text>

  <!-- tagline -->
  <text x="600" y="154" text-anchor="middle"
        fill="#D1FAE5"
        font-family="Inter, Arial, sans-serif"
        font-size="13"
        font-weight="500"
        letter-spacing="2.2">
    BUILDING SYSTEMS THAT CONNECT INFORMATION TO ACTION
  </text>
</svg>
